<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 计划管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 50px 40px;
        }
        .logo-section { text-align: center; margin-bottom: 40px; }
        .logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .logo svg { width: 42px; height: 42px; fill: white; }
        h1 { color: #2c3e50; font-size: 26px; font-weight: 600; margin-bottom: 8px; }
        .subtitle { color: #95a5a6; font-size: 14px; }
        .form-group { margin-bottom: 24px; }
        label { display: block; color: #34495e; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e6ed;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }
        input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15); }
        .password-wrapper { position: relative; }
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #95a5a6;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .error-message {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .error-message.show { display: block; }
        .demo-accounts {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e0e6ed;
        }
        .demo-title {
            color: #7f8c8d;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .demo-list { display: flex; flex-direction: column; gap: 8px; }
        .demo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #f8fafc;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .demo-item:hover { background: #f0f3ff; }
        .demo-role { font-size: 13px; color: #34495e; font-weight: 500; }
        .demo-account { font-size: 12px; color: #95a5a6; }

        /* 首次登录修改密码弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            </div>
            <h1>计划管理系统</h1>
            <p class="subtitle">请登录您的账户</p>
        </div>

        <div class="error-message" id="errorMsg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">工号</label>
                <input type="text" id="username" name="username" placeholder="请输入工号" maxlength="20" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
                    <span class="password-toggle" onclick="togglePassword()">👁️</span>
                </div>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">登录</button>
        </form>

        <div class="demo-accounts">
            <div class="demo-title">测试账号</div>
            <div class="demo-list">
                <div class="demo-item" onclick="fillDemo('000000', 'admin123')">
                    <span class="demo-role">⚙️ 管理员</span>
                    <span class="demo-account">工号: 000000 / 密码: admin123</span>
                </div>
                <div class="demo-item" onclick="fillDemo('MY', 'leader123')">
                    <span class="demo-role">👥 组长（综合计划组）</span>
                    <span class="demo-account">工号: MY / 密码: leader123</span>
                </div>
                <div class="demo-item" onclick="fillDemo('DH', 'leader123')">
                    <span class="demo-role">👥 组长（客户管理组）</span>
                    <span class="demo-account">工号: DH / 密码: leader123</span>
                </div>
                <div class="demo-item" onclick="fillDemo('ZR', 'director123')">
                    <span class="demo-role">🎯 主任</span>
                    <span class="demo-account">工号: ZR / 密码: director123</span>
                </div>
                <div class="demo-item" onclick="fillDemo('ZZY', 'member123')">
                    <span class="demo-role">👤 组员（综合计划组）</span>
                    <span class="demo-account">工号: ZZY / 密码: member123</span>
                </div>
                <div class="demo-item" onclick="fillDemo('A1', 'member123')">
                    <span class="demo-role">👤 组员（客户管理组）</span>
                    <span class="demo-account">工号: A1 / 密码: member123</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 首次登录修改密码弹窗 -->
    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <div class="modal-title">🔒 首次登录请修改密码</div>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="请输入新密码（至少6位）" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入新密码" minlength="6" required>
                </div>
                <div id="passwordModalError" style="color:#e74c3c;font-size:13px;margin-top:10px;display:none;"></div>
            <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="logout()">取消</button>
                    <button type="submit" class="btn btn-primary">确认修改</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // API基础路径
        const API_BASE = '/api';

        // 页面加载时检查是否已登录
        document.addEventListener('DOMContentLoaded', function() {
            const token = sessionStorage.getItem('token');
            if (token) {
                // 验证token是否有效
                fetch(`${API_BASE}/user/info`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                }).then(res => res.json()).then(data => {
                    if (data.code === 200) {
                        // token有效，检查是否需要修改密码
                        if (data.data.must_change_password === 1) {
                            document.getElementById('passwordModal').classList.add('show');
                        } else {
                            redirectByRole(data.data.role);
                        }
                    } else {
                        sessionStorage.removeItem('token');
                        sessionStorage.removeItem('user');
                    }
                }).catch(() => {
                    sessionStorage.removeItem('token');
                    sessionStorage.removeItem('user');
                });
            }
        });

        // 填充测试账号
        function fillDemo(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }

        // 切换密码显示
        function togglePassword() {
            const pwd = document.getElementById('password');
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
        }

        // 显示错误信息
        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>登录中...';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.code === 200) {
                    sessionStorage.setItem('token', data.data.token);
                    sessionStorage.setItem('user', JSON.stringify(data.data.user));

                    // 检查是否需要修改密码
                    if (data.data.user.must_change_password === 1) {
                        document.getElementById('passwordModal').classList.add('show');
                        btn.innerHTML = '登录';
                        btn.disabled = false;
                    } else {
                        redirectByRole(data.data.user.role);
                    }
                } else if (data.code === 423) {
                    showError(data.message + ' (账户已锁定)');
                    btn.innerHTML = '登录';
                    btn.disabled = false;
                } else {
                    showError(data.message);
                    btn.innerHTML = '登录';
                    btn.disabled = false;
                }
            } catch (err) {
                showError('网络错误，请检查服务器连接');
                btn.innerHTML = '登录';
                btn.disabled = false;
            }
        });

        // 修改密码表单提交
        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errEl = document.getElementById('passwordModalError');

            if (newPassword !== confirmPassword) {
                errEl.textContent = '两次输入的密码不一致'; errEl.style.display = 'block'; return;
            }
            if (newPassword.length < 6) {
                errEl.textContent = '密码长度不能少于6位'; errEl.style.display = 'block'; return;
            }

            const token = sessionStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/auth/password`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ oldPassword: '', newPassword })
                });
                const data = await res.json();

                if (data.code === 200) {
                    document.getElementById('passwordModal').classList.remove('show');
                    // 获取最新用户信息并跳转
                    const userRes = await fetch(`${API_BASE}/user/info`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const userData = await userRes.json();
                    if (userData.code === 200) {
                        sessionStorage.setItem('user', JSON.stringify(userData.data));
                        redirectByRole(userData.data.role);
                    }
                } else {
                    errEl.textContent = data.message || '修改失败'; errEl.style.display = 'block';
                }
            } catch (err) {
                errEl.textContent = '网络错误'; errEl.style.display = 'block';
            }
        });

        // 根据角色跳转
        function redirectByRole(role) {
            if (role === 'ADMIN') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'index.html';
            }
        }

        // 登出
        function logout() {
            sessionStorage.removeItem('token');
            sessionStorage.removeItem('user');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
