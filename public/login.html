<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 计划管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        .login-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
        }
        
        /* 左侧品牌区 */
        .brand-section {
            position: relative;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow: hidden;
        }
        
        /* 装饰网格 */
        .brand-section::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        
        /* 装饰光晕 */
        .brand-blur-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            filter: blur(80px);
            top: 10%;
            right: 20%;
            animation: float1 8s ease-in-out infinite;
        }
        .brand-blur-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            filter: blur(100px);
            bottom: 10%;
            left: 10%;
            animation: float2 10s ease-in-out infinite;
        }
        
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, 30px); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, -20px); }
        }
        
        /* 品牌Logo */
        .brand-logo {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            margin-bottom: 60px;
        }
        .brand-logo-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-logo-icon svg { width: 24px; height: 24px; fill: white; }
        .brand-logo-text {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        


        /* 互动角色区域 */
        .characters-container {
            position: relative;
            z-index: 2;
            width: 550px;
            height: 400px;
        }
        
        /* 角色基类 */
        .character {
            position: absolute;
            bottom: 0;
            transition: all 0.7s ease-in-out;
            transform-origin: bottom center;
        }
        
        /* 眼睛容器 */
        .eyes {
            position: absolute;
            display: flex;
            transition: all 0.7s ease-in-out;
        }
        
        /* 眼白（紫/黑角色用） */
        .eye {
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: height 0.15s ease;
        }
        
        /* 瞳孔 */
        .pupil {
            background: #2D2D2D;
            border-radius: 50%;
            transition: transform 0.1s ease-out;
        }
        
        /* 无眼白角色（橙/黄） - 只有瞳孔 */
        .char-orange .eye,
        .char-yellow .eye {
            background: transparent;
        }
        .char-orange .pupil,
        .char-yellow .pupil {
            width: 100% !important;
            height: 100% !important;
        }
        
        /* 眨眼 */
        .eye.blink {
            height: 2px !important;
        }
        .eye.blink .pupil {
            opacity: 0;
        }
        
        /* 紫色角色 - 后面 */
        .char-purple {
            left: 70px;
            width: 180px;
            height: 400px;
            background: #6C3FF5;
            border-radius: 10px 10px 0 0;
            z-index: 1;
        }
        .char-purple .eyes {
            left: 45px;
            top: 40px;
            gap: 32px;
        }
        .char-purple .eye {
            width: 18px;
            height: 18px;
        }
        .char-purple .pupil {
            width: 7px;
            height: 7px;
        }
        /* 紫色角色 - 偷看/输入时 */
        .char-purple.peeking {
            height: 440px;
        }
        
        /* 黑色角色 - 中间 */
        .char-dark {
            left: 240px;
            width: 120px;
            height: 310px;
            background: #2D2D2D;
            border-radius: 8px 8px 0 0;
            z-index: 2;
        }
        .char-dark .eyes {
            left: 26px;
            top: 32px;
            gap: 24px;
        }
        .char-dark .eye {
            width: 16px;
            height: 16px;
        }
        .char-dark .pupil {
            width: 6px;
            height: 6px;
        }
        
        /* 橙色角色 - 左前（半圆） */
        .char-orange {
            left: 0;
            width: 240px;
            height: 200px;
            background: #FF9B6B;
            border-radius: 120px 120px 0 0;
            z-index: 3;
        }
        .char-orange .eyes {
            left: 82px;
            top: 90px;
            gap: 32px;
            transition: all 0.2s ease-out;
        }
        .char-orange .eye {
            width: 12px;
            height: 12px;
        }
        .char-orange .pupil {
            width: 12px;
            height: 12px;
        }
        
        /* 黄色角色 - 右前（顶部圆角矩形） */
        .char-yellow {
            left: 310px;
            width: 140px;
            height: 230px;
            background: #E8D754;
            border-radius: 70px 70px 0 0;
            z-index: 4;
        }
        .char-yellow .eyes {
            left: 52px;
            top: 40px;
            gap: 24px;
            transition: all 0.2s ease-out;
        }
        .char-yellow .eye {
            width: 12px;
            height: 12px;
        }
        .char-yellow .pupil {
            width: 12px;
            height: 12px;
        }
        .char-yellow .mouth {
            position: absolute;
            width: 40px;
            height: 4px;
            background: #2D2D2D;
            border-radius: 3px;
            left: 40px;
            top: 88px;
            transition: all 0.2s ease-out;
        }
        /* 右侧品牌文字 */
        .brand-text {
            position: relative;
            z-index: 2;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            margin-top: 50px;
            display: flex;
            gap: 24px;
        }
        .brand-text a {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            transition: color 0.2s;
        }
        .brand-text a:hover {
            color: rgba(255,255,255,0.9);
        }
        
        /* 右侧登录区 */
        .login-section {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            padding: 40px;
        }
        
        .login-container {
            width: 100%;
            max-width: 380px;
        }
        
        /* 移动端Logo */
        .mobile-logo {
            display: none;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .mobile-logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mobile-logo-icon svg { width: 20px; height: 20px; fill: white; }
        .mobile-logo-text { font-size: 16px; font-weight: 600; color: #2c3e50; }
        
        /* 登录标题 */
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .login-header h1 {
            font-size: 26px;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .login-header p {
            color: #95a5a6;
            font-size: 14px;
        }
        
        /* 表单 */
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            color: #34495e;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #e0e6ed;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            outline: none;
            background: white;
        }
        .form-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
        }
        .password-wrapper {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #95a5a6;
            font-size: 18px;
            user-select: none;
        }
        .password-toggle:hover { color: #667eea; }
        
        /* 错误提示 */
        .error-message {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #dc2626;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .error-message.show { display: block; }
        
        /* 登录按钮 - 悬停滑动效果 */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .login-btn .btn-text {
            display: inline-block;
            transition: transform 0.3s, opacity 0.3s;
        }
        .login-btn:hover .btn-text {
            transform: translateX(-8px);
            opacity: 0.7;
        }
        .login-btn .btn-arrow {
            position: absolute;
            right: 50%;
            top: 50%;
            transform: translate(50%, -50%) translateX(-30px);
            opacity: 0;
            transition: all 0.3s;
        }
        .login-btn:hover .btn-arrow {
            transform: translate(50%, -50%) translateX(0);
            opacity: 1;
        }
        
        /* 测试账号 */
        .demo-accounts {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e0e6ed;
        }
        .demo-title {
            color: #7f8c8d;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .demo-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .demo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .demo-item:hover {
            background: #f5f7ff;
            border-color: #667eea;
        }
        .demo-role {
            font-size: 13px;
            color: #34495e;
            font-weight: 500;
        }
        .demo-account {
            font-size: 12px;
            color: #95a5a6;
        }
        
        /* 首次登录修改密码弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* 响应式 */
        @media (max-width: 900px) {
            .login-wrapper {
                grid-template-columns: 1fr;
            }
            .brand-section {
                display: none;
            }
            .mobile-logo {
                display: flex;
            }
            .login-section {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <!-- 左侧品牌区 -->
        <div class="brand-section">
            <div class="brand-blur-1"></div>
            <div class="brand-blur-2"></div>
            
            <div class="brand-logo">
                <div class="brand-logo-icon">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                </div>
                <span class="brand-logo-text">计划管理系统</span>
            </div>
            
            <!-- 互动角色 -->
            <div class="characters-container">
                <!-- 紫色角色 -->
                <div class="character char-purple" id="charPurple">
                    <div class="eyes">
                        <div class="eye" id="purpleEye1"><div class="pupil"></div></div>
                        <div class="eye" id="purpleEye2"><div class="pupil"></div></div>
                    </div>
                </div>
                
                <!-- 黑色角色 -->
                <div class="character char-dark" id="charDark">
                    <div class="eyes">
                        <div class="eye" id="darkEye1"><div class="pupil"></div></div>
                        <div class="eye" id="darkEye2"><div class="pupil"></div></div>
                    </div>
                </div>
                
                <!-- 橙色角色 -->
                <div class="character char-orange" id="charOrange">
                    <div class="eyes">
                        <div class="eye" id="orangeEye1"><div class="pupil"></div></div>
                        <div class="eye" id="orangeEye2"><div class="pupil"></div></div>
                    </div>
                </div>
                
                <!-- 黄色角色 -->
                <div class="character char-yellow" id="charYellow">
                    <div class="eyes">
                        <div class="eye" id="yellowEye1"><div class="pupil"></div></div>
                        <div class="eye" id="yellowEye2"><div class="pupil"></div></div>
                    </div>
                    <div class="mouth"></div>
                </div>
            </div>
            
            <div class="brand-text">
                <a href="#">隐私政策</a>
                <a href="#">服务条款</a>
            </div>
        </div>
        
        <!-- 右侧登录区 -->
        <div class="login-section">
            <div class="login-container">
                <!-- 移动端Logo -->
                <div class="mobile-logo">
                    <div class="mobile-logo-icon">
                        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    </div>
                    <span class="mobile-logo-text">计划管理系统</span>
                </div>
                
                <div class="login-header">
                    <h1>欢迎回来</h1>
                    <p>请登录您的账户</p>
                </div>
                
                <div class="error-message" id="errorMsg"></div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">工号</label>
                        <input type="text" class="form-input" id="username" name="username" placeholder="请输入工号" maxlength="20" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-input" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
                            <span class="password-toggle" id="passwordToggle" title="显示/隐藏密码">👁️</span>
                        </div>
                    </div>
                    <button type="submit" class="login-btn" id="loginBtn">
                        <span class="btn-text">登 录</span>
                        <span class="btn-arrow">→</span>
                    </button>
                </form>
                
                <div class="demo-accounts">
                    <div class="demo-title">测试账号</div>
                    <div class="demo-list">
                        <div class="demo-item" onclick="fillDemo('000000', 'admin123')">
                            <span class="demo-role">⚙️ 管理员</span>
                            <span class="demo-account">000000 / admin123</span>
                        </div>
                        <div class="demo-item" onclick="fillDemo('MY', 'leader123')">
                            <span class="demo-role">👥 组长（综合计划组）</span>
                            <span class="demo-account">MY / leader123</span>
                        </div>
                        <div class="demo-item" onclick="fillDemo('DH', 'leader123')">
                            <span class="demo-role">👥 组长（客户管理组）</span>
                            <span class="demo-account">DH / leader123</span>
                        </div>
                        <div class="demo-item" onclick="fillDemo('ZR', 'director123')">
                            <span class="demo-role">🏢 主任</span>
                            <span class="demo-account">ZR / director123</span>
                        </div>
                        <div class="demo-item" onclick="fillDemo('ZZY', 'member123')">
                            <span class="demo-role">👤 组员</span>
                            <span class="demo-account">ZZY / member123</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 首次登录修改密码弹窗 -->
    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <div class="modal-title">🔒 首次登录请修改密码</div>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <input type="password" class="form-input" id="newPassword" name="newPassword" placeholder="请输入新密码（至少6位）" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" class="form-input" id="confirmPassword" name="confirmPassword" placeholder="请再次输入新密码" minlength="6" required>
                </div>
                <div id="passwordModalError" style="color:#e74c3c;font-size:13px;margin-top:10px;display:none;"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="logout()">取消</button>
                    <button type="submit" class="btn btn-primary">确认修改</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api';
        


        // ========== 互动角色系统 ==========
        const mouseState = { x: 0, y: 0 };
        let isTyping = false;
        let passwordVisible = false;
        let passwordLength = 0;
        let isLookingAtEachOther = false;
        let isPurplePeeking = false;
        let peekTimer = null;
        let blinkTimers = { purple: null, black: null };
        
        // 角色引用
        const charPurple = document.getElementById('charPurple');
        const charDark = document.getElementById('charDark');
        const charOrange = document.getElementById('charOrange');
        const charYellow = document.getElementById('charYellow');
        
        const purpleEyes = charPurple.querySelector('.eyes');
        const darkEyes = charDark.querySelector('.eyes');
        const orangeEyes = charOrange.querySelector('.eyes');
        const yellowEyes = charYellow.querySelector('.eyes');
        const yellowMouth = charYellow.querySelector('.mouth');
        
        const allPupilElements = document.querySelectorAll('.pupil');
        
        // 计算角色位置参数
        function calculatePosition(character) {
            const rect = character.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 3;
            
            const deltaX = mouseState.x - centerX;
            const deltaY = mouseState.y - centerY;
            
            const faceX = Math.max(-15, Math.min(15, deltaX / 20));
            const faceY = Math.max(-10, Math.min(10, deltaY / 30));
            const bodySkew = Math.max(-6, Math.min(6, -deltaX / 120));
            
            return { faceX, faceY, bodySkew };
        }
        
        // 鼠标跟随
        document.addEventListener('mousemove', function(e) {
            mouseState.x = e.clientX;
            mouseState.y = e.clientY;
            updateCharacterPositions();
        });
        
        // 更新所有角色
        function updateCharacterPositions() {
            const showPassword = passwordVisible && passwordLength > 0;
            const isHidingPassword = passwordLength > 0 && !passwordVisible;
            const peeking = isTyping || isHidingPassword;
            
            // === 紫色角色 ===
            const purplePos = calculatePosition(charPurple);
            let purpleSkew = purplePos.bodySkew;
            let purpleEyeLeft = 45 + purplePos.faceX;
            let purpleEyeTop = 40 + purplePos.faceY;
            let purplePupilOffsetX = undefined;
            let purplePupilOffsetY = undefined;
            
            if (showPassword) {
                // 显示密码时：身体不倾斜，眼睛看向左上方（不看密码）
                purpleSkew = 0;
                purpleEyeLeft = 20;
                purpleEyeTop = 35;
                if (isPurplePeeking) {
                    // 偷偷瞥一眼：瞳孔向右下看
                    purplePupilOffsetX = 4;
                    purplePupilOffsetY = 5;
                } else {
                    purplePupilOffsetX = -4;
                    purplePupilOffsetY = -4;
                }
            } else if (isLookingAtEachOther) {
                // 对视时
                purpleEyeLeft = 55;
                purpleEyeTop = 65;
                purplePupilOffsetX = 3;
                purplePupilOffsetY = 4;
            } else if (peeking) {
                // 偷看时：额外倾斜+位移
                purpleSkew = purplePos.bodySkew - 12;
                charPurple.style.transform = 'skewX(' + purpleSkew + 'deg) translateX(40px)';
                charPurple.style.height = '440px';
                purpleEyeLeft = 45 + purplePos.faceX;
                purpleEyeTop = 40 + purplePos.faceY;
            }
            
            if (!peeking || showPassword) {
                charPurple.style.height = showPassword ? '400px' : (peeking ? '440px' : '400px');
            }
            
            if (!(peeking && !showPassword && !isLookingAtEachOther)) {
                charPurple.style.transform = 'skewX(' + purpleSkew + 'deg)';
            }
            
            purpleEyes.style.left = purpleEyeLeft + 'px';
            purpleEyes.style.top = purpleEyeTop + 'px';
            
            // 更新紫色角色瞳孔
            const purplePupils = charPurple.querySelectorAll('.pupil');
            purplePupils.forEach(function(pupil) {
                if (purplePupilOffsetX !== undefined) {
                    pupil.style.transform = 'translate(' + purplePupilOffsetX + 'px, ' + purplePupilOffsetY + 'px)';
                } else {
                    updatePupilPosition(pupil);
                }
            });
            
            // === 黑色角色 ===
            const darkPos = calculatePosition(charDark);
            let darkSkew = darkPos.bodySkew;
            let darkEyeLeft = 26 + darkPos.faceX;
            let darkEyeTop = 32 + darkPos.faceY;
            let darkPupilOffsetX = undefined;
            let darkPupilOffsetY = undefined;
            
            if (showPassword) {
                darkSkew = 0;
                darkEyeLeft = 10;
                darkEyeTop = 28;
                darkPupilOffsetX = -4;
                darkPupilOffsetY = -4;
            } else if (isLookingAtEachOther) {
                darkSkew = darkPos.bodySkew * 1.5 + 10;
                darkEyeLeft = 32;
                darkEyeTop = 12;
                darkPupilOffsetX = 0;
                darkPupilOffsetY = -4;
                charDark.style.transform = 'skewX(' + darkSkew + 'deg) translateX(20px)';
            } else if (peeking) {
                darkSkew = darkPos.bodySkew * 1.5;
                charDark.style.transform = 'skewX(' + darkSkew + 'deg)';
            }
            
            if (!isLookingAtEachOther && !(peeking && !showPassword)) {
                charDark.style.transform = 'skewX(' + darkSkew + 'deg)';
            }
            
            darkEyes.style.left = darkEyeLeft + 'px';
            darkEyes.style.top = darkEyeTop + 'px';
            
            // 更新黑色角色瞳孔
            const darkPupils = charDark.querySelectorAll('.pupil');
            darkPupils.forEach(function(pupil) {
                if (darkPupilOffsetX !== undefined) {
                    pupil.style.transform = 'translate(' + darkPupilOffsetX + 'px, ' + darkPupilOffsetY + 'px)';
                } else {
                    updatePupilPosition(pupil);
                }
            });
            
            // === 橙色角色 ===
            const orangePos = calculatePosition(charOrange);
            let orangeSkew = orangePos.bodySkew;
            let orangeEyeLeft = 82 + orangePos.faceX;
            let orangeEyeTop = 90 + orangePos.faceY;
            let orangePupilOffsetX = undefined;
            let orangePupilOffsetY = undefined;
            
            if (showPassword) {
                orangeSkew = 0;
                orangeEyeLeft = 50;
                orangeEyeTop = 85;
                orangePupilOffsetX = -5;
                orangePupilOffsetY = -4;
            }
            
            charOrange.style.transform = 'skewX(' + orangeSkew + 'deg)';
            orangeEyes.style.left = orangeEyeLeft + 'px';
            orangeEyes.style.top = orangeEyeTop + 'px';
            
            // 更新橙色角色瞳孔
            const orangePupils = charOrange.querySelectorAll('.pupil');
            orangePupils.forEach(function(pupil) {
                if (orangePupilOffsetX !== undefined) {
                    pupil.style.transform = 'translate(' + orangePupilOffsetX + 'px, ' + orangePupilOffsetY + 'px)';
                } else {
                    updatePupilPosition(pupil);
                }
            });
            
            // === 黄色角色 ===
            const yellowPos = calculatePosition(charYellow);
            let yellowSkew = yellowPos.bodySkew;
            let yellowEyeLeft = 52 + yellowPos.faceX;
            let yellowEyeTop = 40 + yellowPos.faceY;
            let yellowMouthLeft = 40 + yellowPos.faceX;
            let yellowMouthTop = 88 + yellowPos.faceY;
            let yellowPupilOffsetX = undefined;
            let yellowPupilOffsetY = undefined;
            
            if (showPassword) {
                yellowSkew = 0;
                yellowEyeLeft = 20;
                yellowEyeTop = 35;
                yellowMouthLeft = 10;
                yellowMouthTop = 88;
                yellowPupilOffsetX = -5;
                yellowPupilOffsetY = -4;
            }
            
            charYellow.style.transform = 'skewX(' + yellowSkew + 'deg)';
            yellowEyes.style.left = yellowEyeLeft + 'px';
            yellowEyes.style.top = yellowEyeTop + 'px';
            yellowMouth.style.left = yellowMouthLeft + 'px';
            yellowMouth.style.top = yellowMouthTop + 'px';
            
            // 更新黄色角色瞳孔
            const yellowPupils = charYellow.querySelectorAll('.pupil');
            yellowPupils.forEach(function(pupil) {
                if (yellowPupilOffsetX !== undefined) {
                    pupil.style.transform = 'translate(' + yellowPupilOffsetX + 'px, ' + yellowPupilOffsetY + 'px)';
                } else {
                    updatePupilPosition(pupil);
                }
            });
        }
        
        // 更新单个瞳孔位置（跟随鼠标）
        function updatePupilPosition(pupil) {
            const eye = pupil.parentElement;
            const rect = eye.getBoundingClientRect();
            const eyeCenterX = rect.left + rect.width / 2;
            const eyeCenterY = rect.top + rect.height / 2;
            
            const deltaX = mouseState.x - eyeCenterX;
            const deltaY = mouseState.y - eyeCenterY;
            const maxDistance = 5;
            const distance = Math.min(Math.sqrt(deltaX * deltaX + deltaY * deltaY), maxDistance);
            const angle = Math.atan2(deltaY, deltaX);
            
            const x = Math.cos(angle) * distance;
            const y = Math.sin(angle) * distance;
            
            pupil.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
        }
        
        // 独立眨眼（只有紫、黑角色眨眼）
        function startBlinking() {
            function purpleBlink() {
                const eyes = charPurple.querySelectorAll('.eye');
                eyes.forEach(function(e) { e.classList.add('blink'); });
                setTimeout(function() {
                    eyes.forEach(function(e) { e.classList.remove('blink'); });
                }, 150);
                blinkTimers.purple = setTimeout(purpleBlink, Math.random() * 4000 + 3000);
            }
            
            function blackBlink() {
                const eyes = charDark.querySelectorAll('.eye');
                eyes.forEach(function(e) { e.classList.add('blink'); });
                setTimeout(function() {
                    eyes.forEach(function(e) { e.classList.remove('blink'); });
                }, 150);
                blinkTimers.black = setTimeout(blackBlink, Math.random() * 4000 + 3000);
            }
            
            purpleBlink();
            blackBlink();
        }
        startBlinking();
        
        // 对视效果
        function triggerLookAtEachOther() {
            isLookingAtEachOther = true;
            updateCharacterPositions();
            
            setTimeout(function() {
                isLookingAtEachOther = false;
                updateCharacterPositions();
            }, 800);
        }
        
        // 紫色角色偷偷瞥密码
        function startPeeking() {
            if (peekTimer) {
                clearTimeout(peekTimer);
                peekTimer = null;
            }
            
            function schedulePeek() {
                peekTimer = setTimeout(function() {
                    if (passwordVisible && passwordLength > 0) {
                        isPurplePeeking = true;
                        updateCharacterPositions();
                        setTimeout(function() {
                            isPurplePeeking = false;
                            updateCharacterPositions();
                            schedulePeek();
                        }, 800);
                    }
                }, Math.random() * 3000 + 2000);
            }
            
            // 第一次快一点
            setTimeout(function() {
                if (passwordVisible && passwordLength > 0) {
                    schedulePeek();
                }
            }, 500);
        }
        
        function stopPeeking() {
            if (peekTimer) {
                clearTimeout(peekTimer);
                peekTimer = null;
            }
            isPurplePeeking = false;
        }
        
        // 输入监听
        function handleInputFocus() {
            isTyping = true;
            triggerLookAtEachOther();
            updateCharacterPositions();
        }
        
        function handleInputBlur() {
            // 检查是否两个输入框都没焦点
            if (!document.activeElement || 
                (document.activeElement.id !== 'username' && document.activeElement.id !== 'password')) {
                isTyping = false;
                updateCharacterPositions();
            }
        }
        
        document.getElementById('username').addEventListener('focus', handleInputFocus);
        document.getElementById('username').addEventListener('blur', handleInputBlur);
        
        document.getElementById('password').addEventListener('focus', handleInputFocus);
        document.getElementById('password').addEventListener('blur', handleInputBlur);
        
        document.getElementById('password').addEventListener('input', function() {
            passwordLength = this.value.length;
            updateCharacterPositions();
            
            // 如果显示密码且有内容，启动偷瞥
            if (passwordVisible && passwordLength > 0) {
                startPeeking();
            } else {
                stopPeeking();
            }
        });
        
        // 密码可见性切换
        document.getElementById('passwordToggle').addEventListener('click', function() {
            const pwd = document.getElementById('password');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                passwordVisible = true;
                this.textContent = '🙈';
                
                if (passwordLength > 0) {
                    startPeeking();
                }
            } else {
                pwd.type = 'password';
                passwordVisible = false;
                this.textContent = '👁️';
                stopPeeking();
            }
            updateCharacterPositions();
        });
        
        // 初始化
        setTimeout(updateCharacterPositions, 100);
        // ========== 页面初始化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            const token = sessionStorage.getItem('token');
            if (token) {
                fetch(API_BASE + '/user/info', {
                    headers: { 'Authorization': 'Bearer ' + token }
                }).then(function(res) { return res.json(); })
                  .then(function(data) {
                    if (data.code === 200) {
                        if (data.data.must_change_password === 1) {
                            document.getElementById('passwordModal').classList.add('show');
                        } else {
                            redirectByRole(data.data.role);
                        }
                    } else {
                        sessionStorage.removeItem('token');
                        sessionStorage.removeItem('user');
                    }
                }).catch(function() {
                    sessionStorage.removeItem('token');
                    sessionStorage.removeItem('user');
                });
            }
        });
        
        // 填充测试账号
        function fillDemo(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }
        
        // 显示错误
        function showError(msg) {
            var el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(function() { el.classList.remove('show'); }, 5000);
        }
        
        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>登录中...';
            
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            
            try {
                var res = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                var data = await res.json();
                
                if (data.code === 200) {
                    sessionStorage.setItem('token', data.data.token);
                    sessionStorage.setItem('user', JSON.stringify(data.data.user));
                    
                    if (data.data.user.must_change_password === 1) {
                        document.getElementById('passwordModal').classList.add('show');
                        btn.innerHTML = '<span class="btn-text">登 录</span><span class="btn-arrow">→</span>';
                        btn.disabled = false;
                    } else {
                        redirectByRole(data.data.user.role);
                    }
                } else if (data.code === 423) {
                    showError(data.message + ' (账户已锁定)');
                    btn.innerHTML = '<span class="btn-text">登 录</span><span class="btn-arrow">→</span>';
                    btn.disabled = false;
                } else {
                    showError(data.message);
                    btn.innerHTML = '<span class="btn-text">登 录</span><span class="btn-arrow">→</span>';
                    btn.disabled = false;
                }
            } catch(err) {
                showError('网络错误，请检查服务器连接');
                btn.innerHTML = '<span class="btn-text">登 录</span><span class="btn-arrow">→</span>';
                btn.disabled = false;
            }
        });
        
        // 修改密码表单
        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var errEl = document.getElementById('passwordModalError');
            
            if (newPassword !== confirmPassword) {
                errEl.textContent = '两次输入的密码不一致';
                errEl.style.display = 'block';
                return;
            }
            if (newPassword.length < 6) {
                errEl.textContent = '密码长度不能少于6位';
                errEl.style.display = 'block';
                return;
            }
            
            var token = sessionStorage.getItem('token');
            try {
                var res = await fetch(API_BASE + '/auth/password', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ oldPassword: '', newPassword: newPassword })
                });
                var data = await res.json();
                
                if (data.code === 200) {
                    document.getElementById('passwordModal').classList.remove('show');
                    var userRes = await fetch(API_BASE + '/user/info', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    var userData = await userRes.json();
                    if (userData.code === 200) {
                        sessionStorage.setItem('user', JSON.stringify(userData.data));
                        redirectByRole(userData.data.role);
                    }
                } else {
                    errEl.textContent = data.message || '修改失败';
                    errEl.style.display = 'block';
                }
            } catch(err) {
                errEl.textContent = '网络错误';
                errEl.style.display = 'block';
            }
        });
        
        function redirectByRole(role) {
            if (role === 'ADMIN') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'index.html';
            }
        }
        
        function logout() {
            sessionStorage.removeItem('token');
            sessionStorage.removeItem('user');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
