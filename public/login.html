<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 计划管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        .login-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
        }
        
        /* 左侧品牌区 */
        .brand-section {
            position: relative;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow: hidden;
        }
        
        /* 装饰网格 */
        .brand-section::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        
        /* 装饰光晕 */
        .brand-blur-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            filter: blur(80px);
            top: 10%;
            right: 20%;
            animation: float1 8s ease-in-out infinite;
        }
        .brand-blur-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            filter: blur(100px);
            bottom: 10%;
            left: 10%;
            animation: float2 10s ease-in-out infinite;
        }
        
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, 30px); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, -20px); }
        }
        
        /* 品牌Logo */
        .brand-logo {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            margin-bottom: 60px;
        }
        .brand-logo-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-logo-icon svg { width: 24px; height: 24px; fill: white; }
        .brand-logo-text {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        

        /* 互动角色区域 */
        .characters-container {
            position: relative;
            z-index: 2;
            width: 550px;
            height: 400px;
        }
        
        /* 角色基类 */
        .character {
            position: absolute;
            bottom: 0;
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), height 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: bottom center;
        }
        
        /* 眼睛容器 - 跟随鼠标整体移动 */
        .eyes {
            position: absolute;
            display: flex;
            transition: left 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        top 0.7s cubic-bezier(0.34, 1.56, 0.64, 1),
                        gap 0.3s ease;
        }
        
        /* 眼白 */
        .eye {
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: height 0.1s ease, background 0.3s ease;
            overflow: hidden;
        }
        
        /* 瞳孔 */
        .pupil {
            background: #2D2D2D;
            border-radius: 50%;
            transition: transform 0.1s ease-out, opacity 0.1s ease;
        }
        
        /* 无眼白角色（橙/黄） */
        .char-orange .eye,
        .char-yellow .eye {
            background: transparent;
        }
        .char-orange .pupil,
        .char-yellow .pupil {
            width: 100% !important;
            height: 100% !important;
        }
        
        /* 眨眼动画 */
        .eye.blink {
            height: 3px !important;
        }
        .eye.blink .pupil {
            opacity: 0;
        }
        
        /* 紫色角色 - 后面 */
        .char-purple {
            left: 70px;
            width: 180px;
            height: 400px;
            background: linear-gradient(180deg, #7C4FF5 0%, #5B2FD6 100%);
            border-radius: 10px 10px 0 0;
            z-index: 1;
        }
        .char-purple .eyes {
            left: 45px;
            top: 40px;
            gap: 32px;
        }
        .char-purple .eye {
            width: 18px;
            height: 18px;
        }
        .char-purple .pupil {
            width: 7px;
            height: 7px;
        }
        /* 紫色角色 - 偷看密码时伸脖子 */
        .char-purple.hiding-password {
            height: 440px;
            transform: skewX(-12deg) translateX(40px);
        }
        .char-purple.hiding-password .eyes {
            left: 20px;
            top: 35px;
        }
        /* 紫色角色 - 显示密码时害羞低头 */
        .char-purple.password-visible {
            transform: translateY(5px);
        }
        .char-purple.password-visible .eyes {
            left: 20px;
            top: 35px;
        }
        /* 紫色角色 - 偷偷瞥一眼 */
        .char-purple.sneak-peek .eyes {
            left: 55px !important;
            top: 65px !important;
        }
        /* 紫色角色 - 对视时 */
        .char-purple.looking-at-other {
            transform: skewX(-10deg) translateX(30px);
        }
        .char-purple.looking-at-other .eyes {
            left: 55px;
            top: 65px;
        }
        
        /* 黑色角色 - 中间 */
        .char-dark {
            left: 240px;
            width: 120px;
            height: 310px;
            background: linear-gradient(180deg, #3D3D3D 0%, #1D1D1D 100%);
            border-radius: 8px 8px 0 0;
            z-index: 2;
        }
        .char-dark .eyes {
            left: 26px;
            top: 32px;
            gap: 24px;
        }
        .char-dark .eye {
            width: 16px;
            height: 16px;
        }
        .char-dark .pupil {
            width: 6px;
            height: 6px;
        }
        /* 黑色角色 - 偷看密码时 */
        .char-dark.hiding-password .eyes {
            left: 10px;
            top: 28px;
        }
        .char-dark.password-visible .eyes {
            left: 10px;
            top: 28px;
        }
        /* 黑色角色 - 对视时 */
        .char-dark.looking-at-other {
            transform: skewX(10deg) translateX(20px);
        }
        .char-dark.looking-at-other .eyes {
            left: 32px;
            top: 12px;
        }
        
        /* 橙色角色 - 左前 */
        .char-orange {
            left: 0;
            width: 240px;
            height: 200px;
            background: linear-gradient(180deg, #FF9B6B 0%, #FF8C5A 100%);
            border-radius: 120px 120px 0 0;
            z-index: 3;
        }
        .char-orange .eyes {
            left: 82px;
            top: 90px;
            gap: 32px;
        }
        .char-orange .eye {
            width: 12px;
            height: 12px;
        }
        .char-orange .pupil {
            width: 12px;
            height: 12px;
        }
        .char-orange.password-visible .eyes {
            left: 50px;
            top: 85px;
        }
        
        /* 黄色角色 - 右前 */
        .char-yellow {
            left: 310px;
            width: 140px;
            height: 230px;
            background: linear-gradient(180deg, #E8D754 0%, #D4C940 100%);
            border-radius: 70px 70px 0 0;
            z-index: 4;
        }
        .char-yellow .eyes {
            left: 52px;
            top: 40px;
            gap: 24px;
        }
        .char-yellow .eye {
            width: 12px;
            height: 12px;
        }
        .char-yellow .pupil {
            width: 12px;
            height: 12px;
        }
        .char-yellow .mouth {
            position: absolute;
            width: 40px;
            height: 4px;
            background: #2D2D2D;
            border-radius: 3px;
            left: 40px;
            top: 88px;
            transition: left 0.7s cubic-bezier(0.34, 1.56, 0.64, 1),
                        top 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .char-yellow.password-visible .eyes {
            left: 20px;
            top: 35px;
        }
        .char-yellow.password-visible .mouth {
            left: 10px;
            top: 88px;
        }
        /* 右侧品牌文字 */
        .brand-text {
            position: relative;
            z-index: 2;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            margin-top: 50px;
            display: flex;
            gap: 24px;
        }
        .brand-text a {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            transition: color 0.2s;
        }
        .brand-text a:hover {
            color: rgba(255,255,255,0.9);
        }
        
        /* 右侧登录区 */
        .login-section {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            padding: 40px;
        }
        
        .login-container {
            width: 100%;
            max-width: 380px;
        }
        
        /* 移动端Logo */
        .mobile-logo {
            display: none;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .mobile-logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mobile-logo-icon svg { width: 20px; height: 20px; fill: white; }
        .mobile-logo-text { font-size: 16px; font-weight: 600; color: #2c3e50; }
        
        /* 登录标题 */
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .login-header h1 {
            font-size: 26px;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .login-header p {
            color: #95a5a6;
            font-size: 14px;
        }
        
        /* 表单 */
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            color: #34495e;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #e0e6ed;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            outline: none;
            background: white;
        }
        .form-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
        }
        .password-wrapper {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #95a5a6;
            font-size: 18px;
            user-select: none;
        }
        .password-toggle:hover { color: #667eea; }
        
        /* 错误提示 */
        .error-message {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #dc2626;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .error-message.show { display: block; }
        
        /* 登录按钮 - 悬停滑动效果 */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .login-btn .btn-text {
            display: inline-block;
            transition: transform 0.3s, opacity 0.3s;
        }
        .login-btn:hover .btn-text {
            transform: translateX(-8px);
            opacity: 0.7;
        }
        .login-btn .btn-arrow {
            position: absolute;
            right: 50%;
            top: 50%;
            transform: translate(50%, -50%) translateX(-30px);
            opacity: 0;
            transition: all 0.3s;
        }
        .login-btn:hover .btn-arrow {
            transform: translate(50%, -50%) translateX(0);
            opacity: 1;
        }
        
        /* 测试账号 */
        .demo-accounts {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e0e6ed;
        }
        .demo-title {
            color: #7f8c8d;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .demo-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .demo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .demo-item:hover {
            background: #f5f7ff;
            border-color: #667eea;
        }
        .demo-role {
            font-size: 13px;
            color: #34495e;
            font-weight: 500;
        }
        .demo-account {
            font-size: 12px;
            color: #95a5a6;
        }
        
        /* 首次登录修改密码弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* 响应式 */
        @media (max-width: 900px) {
            .login-wrapper {
                grid-template-columns: 1fr;
            }
            .brand-section {
                display: none;
            }
            .mobile-logo {
                display: flex;
            }
            .login-section {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <!-- 左侧品牌区 -->
        <div class="brand-section">
            <div class="brand-blur-1"></div>
            <div class="brand-blur-2"></div>
            
            <div class="brand-logo">
                <div class="brand-logo-icon">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                </div>
                <span class="brand-logo-text">计划管理系统</span>
            </div>
            
            <!-- 互动角色 -->
            <div class="characters-container">
                <!-- 紫色角色 -->
                <div class="character char-purple" id="charPurple">
                    <div class="eyes">
                        <div class="eye" id="purpleEye1"><div class="pupil"></div></div>
                        <div class="eye" id="purpleEye2"><div class="pupil"></div></div>
                    </div>
                </div>
                
                <!-- 黑色角色 -->
                <div class="character char-dark" id="charDark">
                    <div class="eyes">
                        <div class="eye" id="darkEye1"><div class="pupil"></div></div>
                        <div class="eye" id="darkEye2"><div class="pupil"></div></div>
                    </div>
                </div>
                
                <!-- 橙色角色 -->
                <div class="character char-orange" id="charOrange">
                    <div class="eyes">
                        <div class="eye" id="orangeEye1"><div class="pupil"></div></div>
                        <div class="eye" id="orangeEye2"><div class="pupil"></div></div>
                    </div>
                </div>
                
                <!-- 黄色角色 -->
                <div class="character char-yellow" id="charYellow">
                    <div class="eyes">
                        <div class="eye" id="yellowEye1"><div class="pupil"></div></div>
                        <div class="eye" id="yellowEye2"><div class="pupil"></div></div>
                    </div>
                    <div class="mouth"></div>
                </div>
            </div>
            
            <div class="brand-text">
                <a href="#">隐私政策</a>
                <a href="#">服务条款</a>
            </div>
        </div>
        
        <!-- 右侧登录区 -->
        <div class="login-section">
            <div class="login-container">
                <!-- 移动端Logo -->
                <div class="mobile-logo">
                    <div class="mobile-logo-icon">
                        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    </div>
                    <span class="mobile-logo-text">计划管理系统</span>
                </div>
                
                <div class="login-header">
                    <h1>欢迎回来</h1>
                    <p>请登录您的账户</p>
                </div>
                
                <div class="error-message" id="errorMsg"></div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">工号</label>
                        <input type="text" class="form-input" id="username" name="username" placeholder="请输入工号" maxlength="20" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-input" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
                            <span class="password-toggle" id="passwordToggle" title="显示/隐藏密码">👁️</span>
                        </div>
                    </div>
                    <button type="submit" class="login-btn" id="loginBtn">
                        <span class="btn-text">登 录</span>
                        <span class="btn-arrow">→</span>
                    </button>
                </form>
                
                <div class="demo-accounts">
                    <div class="demo-title">测试账号</div>
                    <div class="demo-list">
                        <div class="demo-item" onclick="fillDemo('000000', 'admin123')">
                            <span class="demo-role">⚙️ 管理员</span>
                            <span class="demo-account">000000 / admin123</span>
                        </div>
                        <div class="demo-item" onclick="fillDemo('MY', 'leader123')">
                            <span class="demo-role">👥 组长（综合计划组）</span>
                            <span class="demo-account">MY / leader123</span>
                        </div>
                        <div class="demo-item" onclick="fillDemo('DH', 'leader123')">
                            <span class="demo-role">👥 组长（客户管理组）</span>
                            <span class="demo-account">DH / leader123</span>
                        </div>
                        <div class="demo-item" onclick="fillDemo('ZR', 'director123')">
                            <span class="demo-role">🏢 主任</span>
                            <span class="demo-account">ZR / director123</span>
                        </div>
                        <div class="demo-item" onclick="fillDemo('ZZY', 'member123')">
                            <span class="demo-role">👤 组员</span>
                            <span class="demo-account">ZZY / member123</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 首次登录修改密码弹窗 -->
    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <div class="modal-title">🔒 首次登录请修改密码</div>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <input type="password" class="form-input" id="newPassword" name="newPassword" placeholder="请输入新密码（至少6位）" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" class="form-input" id="confirmPassword" name="confirmPassword" placeholder="请再次输入新密码" minlength="6" required>
                </div>
                <div id="passwordModalError" style="color:#e74c3c;font-size:13px;margin-top:10px;display:none;"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="logout()">取消</button>
                    <button type="submit" class="btn btn-primary">确认修改</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api';
        

        // ========== 互动角色系统 ==========
        const mouseState = { x: 0, y: 0 };
        let isTyping = false;
        let passwordVisible = false;
        let passwordLength = 0;
        let isLookingAtEachOther = false;
        let isSneakPeeking = false;
        let sneakPeekTimer = null;
        
        // 角色引用
        const charPurple = document.getElementById('charPurple');
        const charDark = document.getElementById('charDark');
        const charOrange = document.getElementById('charOrange');
        const charYellow = document.getElementById('charYellow');
        
        const purpleEyes = charPurple.querySelector('.eyes');
        const darkEyes = charDark.querySelector('.eyes');
        const orangeEyes = charOrange.querySelector('.eyes');
        const yellowEyes = charYellow.querySelector('.eyes');
        const yellowMouth = charYellow.querySelector('.mouth');
        
        const allEyeElements = document.querySelectorAll('.eye');
        const allPupilElements = document.querySelectorAll('.pupil');
        
        // 眼睛基础位置（用于计算偏移）
        const eyeBasePositions = {
            purple: { left: 45, top: 40 },
            dark: { left: 26, top: 32 },
            orange: { left: 82, top: 90 },
            yellow: { left: 52, top: 40 }
        };
        
        // 鼠标跟随
        document.addEventListener('mousemove', function(e) {
            mouseState.x = e.clientX;
            mouseState.y = e.clientY;
            updateCharacterPositions();
        });
        
        // 更新所有角色位置（身体倾斜 + 眼睛移动）
        function updateCharacterPositions() {
            if (passwordVisible && !isSneakPeeking) return; // 显示密码时不跟随鼠标
            if (isLookingAtEachOther) return; // 对视时不跟随
            
            // 紫色角色
            updateSingleChar(charPurple, purpleEyes, 45, 40, 15, 10, -6);
            
            // 黑色角色
            updateSingleChar(charDark, darkEyes, 26, 32, 12, 8, -6);
            
            // 橙色角色
            updateSingleChar(charOrange, orangeEyes, 82, 90, 10, 6, -4);
            
            // 黄色角色
            updateSingleChar(charYellow, yellowEyes, 52, 40, 10, 6, -4);
            if (yellowMouth) {
                const mouthX = 40 + getMouseDelta(charYellow, 10, 0).x;
                yellowMouth.style.left = mouthX + 'px';
            }
            
            // 更新瞳孔
            updateAllPupils();
        }
        
        function getMouseDelta(element, maxFaceX, maxFaceY) {
            const rect = element.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 3;
            
            const deltaX = mouseState.x - centerX;
            const deltaY = mouseState.y - centerY;
            
            const faceX = Math.max(-maxFaceX, Math.min(maxFaceX, deltaX / 20));
            const faceY = Math.max(-maxFaceY, Math.min(maxFaceY, deltaY / 30));
            
            return { x: faceX, y: faceY, deltaX: deltaX };
        }
        
        function updateSingleChar(charEl, eyesEl, baseLeft, baseTop, maxFaceX, maxFaceY, maxSkew) {
            if (!charEl || !eyesEl) return;
            
            // 偷看密码或显示密码状态下不跟随鼠标倾斜身体
            if (charEl.classList.contains('hiding-password') || 
                charEl.classList.contains('password-visible') ||
                charEl.classList.contains('looking-at-other')) {
                return;
            }
            
            const delta = getMouseDelta(charEl, maxFaceX, maxFaceY);
            const bodySkew = Math.max(maxSkew, Math.min(-maxSkew, -delta.deltaX / 120));
            
            charEl.style.transform = 'skewX(' + bodySkew + 'deg)';
            eyesEl.style.left = (baseLeft + delta.x) + 'px';
            eyesEl.style.top = (baseTop + delta.y) + 'px';
        }
        
        // 更新所有瞳孔位置
        function updateAllPupils() {
            allPupilElements.forEach(function(pupil) {
                const eye = pupil.parentElement;
                const rect = eye.getBoundingClientRect();
                const eyeCenterX = rect.left + rect.width / 2;
                const eyeCenterY = rect.top + rect.height / 2;
                
                const deltaX = mouseState.x - eyeCenterX;
                const deltaY = mouseState.y - eyeCenterY;
                
                const maxDist = 4;
                const dist = Math.min(Math.sqrt(deltaX * deltaX + deltaY * deltaY), maxDist);
                const angle = Math.atan2(deltaY, deltaX);
                
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;
                
                pupil.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
            });
        }
        
        // 独立眨眼动画
        function startBlinking() {
            // 紫色角色眨眼
            function purpleBlink() {
                const eyes = charPurple.querySelectorAll('.eye');
                eyes.forEach(function(e) { e.classList.add('blink'); });
                setTimeout(function() {
                    eyes.forEach(function(e) { e.classList.remove('blink'); });
                }, 150);
                setTimeout(purpleBlink, Math.random() * 4000 + 3000);
            }
            
            // 黑色角色眨眼
            function darkBlink() {
                const eyes = charDark.querySelectorAll('.eye');
                eyes.forEach(function(e) { e.classList.add('blink'); });
                setTimeout(function() {
                    eyes.forEach(function(e) { e.classList.remove('blink'); });
                }, 150);
                setTimeout(darkBlink, Math.random() * 4000 + 3500);
            }
            
            // 橙色角色眨眼
            function orangeBlink() {
                const eyes = charOrange.querySelectorAll('.eye');
                eyes.forEach(function(e) { e.classList.add('blink'); });
                setTimeout(function() {
                    eyes.forEach(function(e) { e.classList.remove('blink'); });
                }, 120);
                setTimeout(orangeBlink, Math.random() * 3000 + 2500);
            }
            
            // 黄色角色眨眼
            function yellowBlink() {
                const eyes = charYellow.querySelectorAll('.eye');
                eyes.forEach(function(e) { e.classList.add('blink'); });
                setTimeout(function() {
                    eyes.forEach(function(e) { e.classList.remove('blink'); });
                }, 120);
                setTimeout(yellowBlink, Math.random() * 3500 + 3000);
            }
            
            purpleBlink();
            darkBlink();
            orangeBlink();
            yellowBlink();
        }
        startBlinking();
        
        // 对视效果
        function triggerLookAtEachOther() {
            isLookingAtEachOther = true;
            
            charPurple.classList.add('looking-at-other');
            charDark.classList.add('looking-at-other');
            
            // 对视时眼睛位置
            purpleEyes.style.left = '55px';
            purpleEyes.style.top = '65px';
            darkEyes.style.left = '32px';
            darkEyes.style.top = '12px';
            
            setTimeout(function() {
                isLookingAtEachOther = false;
                charPurple.classList.remove('looking-at-other');
                charDark.classList.remove('looking-at-other');
                updateCharacterPositions();
            }, 800);
        }
        
        // 偷偷瞥密码效果（紫色角色）
        function startSneakPeeking() {
            if (sneakPeekTimer) clearInterval(sneakPeekTimer);
            
            function sneakPeek() {
                if (!passwordVisible || passwordLength === 0) return;
                
                isSneakPeeking = true;
                charPurple.classList.add('sneak-peek');
                
                // 瞥一眼后马上缩回去
                setTimeout(function() {
                    isSneakPeeking = false;
                    charPurple.classList.remove('sneak-peek');
                }, 800);
            }
            
            // 第一次马上来一下
            setTimeout(sneakPeek, 500);
            
            // 之后周期性偷看
            sneakPeekTimer = setInterval(function() {
                if (passwordVisible && passwordLength > 0) {
                    sneakPeek();
                }
            }, Math.random() * 3000 + 2000);
        }
        
        function stopSneakPeeking() {
            if (sneakPeekTimer) {
                clearInterval(sneakPeekTimer);
                sneakPeekTimer = null;
            }
            isSneakPeeking = false;
            charPurple.classList.remove('sneak-peek');
        }
        
        // 输入状态监听
        document.getElementById('username').addEventListener('focus', function() {
            isTyping = true;
            triggerLookAtEachOther();
            // 所有角色进入偷看状态（伸脖子）
            [charPurple, charDark, charOrange, charYellow].forEach(function(c) {
                if (c) c.classList.add('hiding-password');
            });
        });
        document.getElementById('username').addEventListener('blur', function() {
            isTyping = false;
            if (!document.getElementById('password').matches(':focus')) {
                [charPurple, charDark, charOrange, charYellow].forEach(function(c) {
                    if (c) c.classList.remove('hiding-password');
                });
                updateCharacterPositions();
            }
        });
        
        document.getElementById('password').addEventListener('focus', function() {
            isTyping = true;
            if (passwordVisible) {
                [charPurple, charDark, charOrange, charYellow].forEach(function(c) {
                    if (c) c.classList.add('password-visible');
                });
                startSneakPeeking();
            } else {
                [charPurple, charDark, charOrange, charYellow].forEach(function(c) {
                    if (c) c.classList.add('hiding-password');
                });
                triggerLookAtEachOther();
            }
        });
        document.getElementById('password').addEventListener('blur', function() {
            isTyping = false;
            if (!document.getElementById('username').matches(':focus')) {
                [charPurple, charDark, charOrange, charYellow].forEach(function(c) {
                    if (c) {
                        c.classList.remove('hiding-password');
                        c.classList.remove('password-visible');
                    }
                });
                stopSneakPeeking();
                updateCharacterPositions();
            }
        });
        document.getElementById('password').addEventListener('input', function() {
            passwordLength = this.value.length;
        });
        
        // 密码可见性切换
        document.getElementById('passwordToggle').addEventListener('click', function() {
            const pwd = document.getElementById('password');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                passwordVisible = true;
                this.textContent = '🙈';
                
                // 角色转过去不看
                [charPurple, charDark, charOrange, charYellow].forEach(function(c) {
                    if (c) {
                        c.classList.remove('hiding-password');
                        c.classList.add('password-visible');
                    }
                });
                
                // 紫色角色开始偷偷瞥
                if (isTyping || passwordLength > 0) {
                    startSneakPeeking();
                }
                
            } else {
                pwd.type = 'password';
                passwordVisible = false;
                this.textContent = '👁️';
                
                stopSneakPeeking();
                
                // 转回来继续偷看
                [charPurple, charDark, charOrange, charYellow].forEach(function(c) {
                    if (c) c.classList.remove('password-visible');
                });
                if (isTyping || passwordLength > 0) {
                    [charPurple, charDark, charOrange, charYellow].forEach(function(c) {
                        if (c) c.classList.add('hiding-password');
                    });
                }
                
                updateCharacterPositions();
            }
        });
        
        // 初始化一次位置
        setTimeout(updateCharacterPositions, 100);
        // ========== 页面初始化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            const token = sessionStorage.getItem('token');
            if (token) {
                fetch(API_BASE + '/user/info', {
                    headers: { 'Authorization': 'Bearer ' + token }
                }).then(function(res) { return res.json(); })
                  .then(function(data) {
                    if (data.code === 200) {
                        if (data.data.must_change_password === 1) {
                            document.getElementById('passwordModal').classList.add('show');
                        } else {
                            redirectByRole(data.data.role);
                        }
                    } else {
                        sessionStorage.removeItem('token');
                        sessionStorage.removeItem('user');
                    }
                }).catch(function() {
                    sessionStorage.removeItem('token');
                    sessionStorage.removeItem('user');
                });
            }
        });
        
        // 填充测试账号
        function fillDemo(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }
        
        // 显示错误
        function showError(msg) {
            var el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(function() { el.classList.remove('show'); }, 5000);
        }
        
        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>登录中...';
            
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            
            try {
                var res = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                var data = await res.json();
                
                if (data.code === 200) {
                    sessionStorage.setItem('token', data.data.token);
                    sessionStorage.setItem('user', JSON.stringify(data.data.user));
                    
                    if (data.data.user.must_change_password === 1) {
                        document.getElementById('passwordModal').classList.add('show');
                        btn.innerHTML = '<span class="btn-text">登 录</span><span class="btn-arrow">→</span>';
                        btn.disabled = false;
                    } else {
                        redirectByRole(data.data.user.role);
                    }
                } else if (data.code === 423) {
                    showError(data.message + ' (账户已锁定)');
                    btn.innerHTML = '<span class="btn-text">登 录</span><span class="btn-arrow">→</span>';
                    btn.disabled = false;
                } else {
                    showError(data.message);
                    btn.innerHTML = '<span class="btn-text">登 录</span><span class="btn-arrow">→</span>';
                    btn.disabled = false;
                }
            } catch(err) {
                showError('网络错误，请检查服务器连接');
                btn.innerHTML = '<span class="btn-text">登 录</span><span class="btn-arrow">→</span>';
                btn.disabled = false;
            }
        });
        
        // 修改密码表单
        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var errEl = document.getElementById('passwordModalError');
            
            if (newPassword !== confirmPassword) {
                errEl.textContent = '两次输入的密码不一致';
                errEl.style.display = 'block';
                return;
            }
            if (newPassword.length < 6) {
                errEl.textContent = '密码长度不能少于6位';
                errEl.style.display = 'block';
                return;
            }
            
            var token = sessionStorage.getItem('token');
            try {
                var res = await fetch(API_BASE + '/auth/password', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ oldPassword: '', newPassword: newPassword })
                });
                var data = await res.json();
                
                if (data.code === 200) {
                    document.getElementById('passwordModal').classList.remove('show');
                    var userRes = await fetch(API_BASE + '/user/info', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    var userData = await userRes.json();
                    if (userData.code === 200) {
                        sessionStorage.setItem('user', JSON.stringify(userData.data));
                        redirectByRole(userData.data.role);
                    }
                } else {
                    errEl.textContent = data.message || '修改失败';
                    errEl.style.display = 'block';
                }
            } catch(err) {
                errEl.textContent = '网络错误';
                errEl.style.display = 'block';
            }
        });
        
        function redirectByRole(role) {
            if (role === 'ADMIN') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'index.html';
            }
        }
        
        function logout() {
            sessionStorage.removeItem('token');
            sessionStorage.removeItem('user');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
